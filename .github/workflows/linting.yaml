name: linting_wf
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
jobs:
  linting-job: #readabiity and understandability
    runs-on: ubuntu-latest
    steps:
      - name: Clone Respository 
        uses: actions/checkout@v4
      - name: create package.json 
        run : npm init -y
      - name: Install HTMLHINT
        run: npm install --save-dev htmlhint 
      - name: Run htmlhint 
        run: npx htmlhint "**/*.html"
        